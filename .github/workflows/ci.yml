name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Build control plane
        run: go build -o /tmp/renderops-control-plane ./cmd/control-plane

      - name: Run tests
        run: go test ./...
