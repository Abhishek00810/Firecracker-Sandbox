name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Build backend
        run: go build -o /tmp/renderops-api ./cmd/api

      - name: Run tests
        run: go test ./...

  guest-agent:
    name: Guest Agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guest-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: guest-agent/go.mod

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Build and test Linux guest agent
        run: GOOS=linux GOARCH=amd64 go test ./...

  sdk:
    name: SDKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/sdk/ts/package-lock.json

      - name: Build TypeScript SDK
        working-directory: backend/sdk/ts
        run: |
          npm ci
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import Python SDK
        working-directory: backend/sdk/python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -c "from renderops import AsyncSandbox, RunResult, Sandbox, Session"
