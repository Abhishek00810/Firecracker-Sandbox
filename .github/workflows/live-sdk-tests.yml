name: Live SDK Tests

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "RenderOps API base URL"
        required: false
        default: "http://20.228.220.165:8080"

jobs:
  live-sdk-tests:
    name: Live Python SDK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RENDEROPS_BASE_URL: ${{ inputs.base_url }}
      RENDEROPS_API_KEY: ${{ secrets.RENDEROPS_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require live API key
        run: |
          test -n "$RENDEROPS_API_KEY"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e backend/sdk/python

      - name: Run stateless execute tests
        run: python testing/test_execute.py

      - name: Run stateful session tests
        run: python testing/test_session.py

      - name: Run timeout tests
        run: python testing/test_timeouts.py
