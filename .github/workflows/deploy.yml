name: Deploy

# Deploys are automated: on every push to main, per-server.
#   Control plane -> a SELF-HOSTED runner living on the basic server. GitHub
#     builds the binary and hands the deploy job to the runner, which installs
#     it locally. No SSH, no key, no password leaves GitHub.
#   Worker -> GitHub SSHes into the bare-metal host with a key held as a secret.
# Path filters keep the two independent — a control-plane change never redeploys
# the worker, and vice-versa.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Which server to deploy (both | control-plane | worker)"
        default: "both"
        type: choice
        options: [both, control-plane, worker]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Detect which server(s) a push actually touched, so we only deploy those.
  changes:
    runs-on: ubuntu-latest
    outputs:
      control_plane: ${{ steps.filter.outputs.control_plane }}
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            control_plane:
              - 'backend/cmd/control-plane/**'
              - 'backend/internal/controlplane/**'
              - 'backend/internal/agent/**'
              - 'backend/internal/plane/**'
              - 'backend/internal/platform/**'
              - 'backend/internal/middleware/**'
              - 'backend/internal/policy/**'
              - 'backend/internal/billing/**'
              - 'backend/go.mod'
              - 'backend/go.sum'
            worker:
              - 'backend/cmd/worker/**'
              - 'backend/internal/executor/**'
              - 'backend/internal/session/**'
              - 'backend/internal/worker/**'
              - 'backend/internal/bootstrap/**'
              - 'backend/internal/cgroup/**'
              - 'backend/internal/vmsize/**'
              - 'backend/internal/plane/**'
              - 'backend/go.mod'
              - 'backend/go.sum'

  # ---- CONTROL PLANE: build on GitHub, deploy on the box via self-hosted runner ----

  # Build stays on a GitHub-hosted runner so the basic server needs no Go toolchain.
  # The compiled binary is handed to the deploy job as an artifact.
  build-control-plane:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' && (inputs.target == 'both' || inputs.target == 'control-plane')
      || github.event_name == 'push' && needs.changes.outputs.control_plane == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Build control-plane (linux/amd64)
        working-directory: backend
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/renderops-control-plane ./cmd/control-plane
      - uses: actions/upload-artifact@v4
        with:
          name: renderops-control-plane
          path: /tmp/renderops-control-plane
          retention-days: 3

  # Runs ON the basic server (the self-hosted runner picks it up via the
  # 'control-plane' label). Installs the binary locally and restarts the service.
  deploy-control-plane:
    needs: build-control-plane
    runs-on: [self-hosted, control-plane]
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: renderops-control-plane
          path: .
      - name: Install and restart
        run: |
          chmod +x renderops-control-plane
          sudo install -D -m 0755 renderops-control-plane /opt/renderops/renderops-control-plane
          sudo systemctl restart renderops-control-plane
      - name: Health check
        run: |
          for i in $(seq 1 15); do
            if curl -fsS -m 4 http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo "healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "control-plane did not become healthy:"
          sudo systemctl status renderops-control-plane --no-pager -l | tail -20 || true
          exit 1

  # ---- WORKER: build on GitHub, deploy over SSH key to the bare-metal host ----

  deploy-worker:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' && (inputs.target == 'both' || inputs.target == 'worker')
      || github.event_name == 'push' && needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Build worker (linux/amd64)
        working-directory: backend
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/renderops-worker ./cmd/worker
      - name: Deploy to bare-metal host
        run: bash ops/deploy/install-worker.sh /tmp/renderops-worker
        env:
          SSH_KEY: ${{ secrets.WORKER_SSH_KEY }}
          SSH_HOST: ${{ secrets.WORKER_HOST }}
          SSH_USER: ${{ secrets.WORKER_USER }}
