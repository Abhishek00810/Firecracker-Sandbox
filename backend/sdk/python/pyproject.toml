[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "renderops"
version = "0.1.0"
description = "Python SDK for the Renderops sandbox code execution API"
requires-python = ">=3.9"
dependencies = ["requests>=2.28", "aiohttp>=3.9"]

[project.optional-dependencies]
dev = ["pytest", "responses"]

[tool.setuptools.packages.find]
where = ["."]
include = ["renderops*"]
